* {

    font-family: "Microsoft Yahei",sans-serif;
}

body {

/* 导航栏 */
.navbar {

.nav-links a {

.nav-links a.active {
    color: #ffffff;
    border-bottom: 2px solid #ffffff;
    padding-bottom: 6px;
}


/* 轮播横幅 */
.banner {
    width: 100%;
    height: 400px;
    margin:0 auto 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 2px 6px rgba(0,0,0,0.1);
    overflow: hidden;
    position: relative;
}

.banner::before {
    content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: url("https://i.postimg.cc/vmCBFrFg/wei-xin-tu-pian-20260530142937-323-100.jpg") center/cover no-repeat;
            opacity: 0.9;
            background-size: cover;
        }
/* ========== 1. 3D外层容器：适配大轨道，给图片足够活动空间 ========== */
.photo-3d-container {
    width: 100%;
    /* 加高容器，避免大轨道图片旋转时被裁切 */
    min-height: 700px;
    /* 上间距40px，下间距留足80px，避免压到下方简介板块 */
    margin: 0 0 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    /* 调大透视距离，大轨道下图片不变形 */
    perspective: 2500px;
    border-radius: 12px;
    perspective-origin: 50% 50%;
    /* 背景和页面底色统一，避免割裂 */
    background-color: #fff5f8;
}

/* ========== 2. 旋转容器：适配大轨道的活动空间 ========== */
.photo-rotate {
    width: 100%;
    height: 600px; /* 加高容器，让图片旋转时不超出边界 */
    position: relative;
    transform-style: preserve-3d;
    /* 放慢动画速度，大轨道旋转更丝滑 */
    animation: rotate 10s infinite linear;
    margin: 0 auto;
}

/* ========== 3. 图片样式：保持220x350尺寸，优化倒影不影响下方 ========== */
.photo-rotate img {
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: center;
    width: 300px;
    height: 400px;
    object-fit: cover;
    border-radius: 8px;
    /* 精准居中，和尺寸对应 */
    margin-top: -200px;
    margin-left: -150px;
    /* 柔和阴影，适配大图片 */
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    /* 缩短倒影，避免延伸到下方板块 */
    -webkit-box-reflect: below 5px linear-gradient(transparent 80%, rgba(255,255,255,0.15));
}

/* ========== 4. 核心：增大轨道半径，让图片向外扩散 ========== */
.photo-rotate img:nth-child(1) { transform: rotateY(0deg) translateZ(360px); }
.photo-rotate img:nth-child(2) { transform: rotateY(120deg) translateZ(360px); }
.photo-rotate img:nth-child(3) { transform: rotateY(240deg) translateZ(360px); }
/* ========== 5. 旋转动画 ========== */
@keyframes rotate {
    from { transform: rotateY(0deg); }
    to { transform: rotateY(360deg); }
}

/* ========== 6. 下方板块过渡优化，和3D区无缝衔接 ========== */
.intro-section, .section-wrap {
    margin-top: 0 !important;
    padding-top: 30px;
    /* 顶部渐变，弱化边界感 */
    background: linear-gradient(to bottom, transparent 0%, #fff5f8 40px);
}


/* 板块通用样式 */
.section-wrap {
    max-width: 1200px;
    margin: 0 auto 40px;
    padding: 0 20px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.section-title {
    font-size: 18px;
    font-weight: bold;
    color: #333;
    display: flex;
    align-items: center;
    gap: 8px;
}

.section-title::before {
    content: '';
    display: inline-block;
    width: 3px;
    height: 18px;
    background: #ff69b4;
}

.more-btn {
    color: #333;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
}
.more-btn:hover {
    color: #ff69b4;
}

/* 卡片网格 */
.card-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.video-card {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    cursor: pointer;
    transition: 0.3s;
}
.video-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(255,105,180,0.15);
}

.card-img {
    width: 100%;
    height: 200px;
    background: rgba(255,182,193,0.2);
    position: relative;
}
/* 播放按钮 */
.card-img::after {
    content: '▶';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.card-info {

}
.card-title {
    font-size: 14px;
    color: #333;
    margin-bottom: 6px;
    line-height: 1.4;
}
.card-date {

    color: #999;
}

/* 视频弹窗 */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}
.modal-content {
    width: 80%;
    max-width: 800px;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
}
.modal-close {
    position: absolute;
    top: 15px;
    right: 15px;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    z-index: 10;
}
.modal-video {

<script>
// 视频弹窗控制
const modal = document.getElementById('videoModal');
const modalVideo = document.getElementById('modalVideo');

function openModal(videoUrl) {
    modalVideo.src = videoUrl;
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden'; // 禁止背景滚动
}

function closeModal() {
    modal.style.display = 'none';
    modalVideo.pause();
    modalVideo.src = '';
    document.body.style.overflow = 'auto';
}

// 点击遮罩层关闭
modal.addEventListener('click', function(e) {
    if (e.target === modal) {
        closeModal();
    }
});
</script>
