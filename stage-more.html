<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> MORE </title>
<style>
 * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
}

body {
    background-color: #fff5f8;
    color: #333;
}

/* 板块通用样式 */
.section-wrap {
    max-width: 1200px;
    margin: 0 auto 40px;
    padding: 0 20px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.section-title {
    font-size: 18px;
    font-weight: bold;
    color: #333;
    display: flex;
    align-items: center;
    gap: 8px;
}

.section-title::before {
    content: '';
    display: inline-block;
    width: 3px;
    height: 18px;
    background: #ff69b4;
}

.more-btn {
    color: #333;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
}
.more-btn:hover {
    color: #ff69b4;
}

/* 卡片网格 */
.card-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.video-card {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    cursor: pointer;
    transition: 0.3s;
}
.video-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(255,105,180,0.15);
}

.card-img {
    width: 100%;
    height: 200px;
    background: rgba(255,182,193,0.2);
    position: relative;
}
/* 播放按钮 */
.card-img::after {
    content: '▶';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.card-info {
    padding: 15px;
}
.card-title {
    font-size: 14px;
    color: #333;
    margin-bottom: 6px;
    line-height: 1.4;
}
.card-date {
    font-size: 12px;
    color: #999;
}

/* 视频弹窗 */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}
.modal-content {
    width: 80%;
    max-width: 800px;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
}
.modal-close {
    position: absolute;
    top: 15px;
    right: 15px;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    z-index: 10;
}
.modal-video {
    width: 100%;
    height: 450px;
    background: #000;
}


/* 页脚 */
.footer {
    background-color: #ffb6c1;
    padding: 20px;
    text-align: center;
    color: #fff;
    margin-top:60px ;
    font-size: 15px;
}
 .footer-links a {
    color: #fff;
    text-decoration: none;
    margin: 0 10px;
}

</style>
</head>

<body>

 <!-- 最新舞台MORE -->
<div class="section-wrap">
    <div class="section-header">
        <div class="section-title">最新舞台</div>
    </div>
    <div class="card-grid">
        <div class="video-card" onclick="openModal('showmeyourlove20260516_.mp4')">
            <div class="card-img" style="background: url('https://i.postimg.cc/wx40L3pX/showmeyourlover0516-0.png') center/cover no-repeat;"></div>
            <div class="card-info">
                <div class="card-title">Show me your love</div>
                <div class="card-date">发布时间:2026-05-16</div>
            </div>
        </div>
        <div class="video-card" onclick="openModal('danceout_20260515_2.mp4')">
            <div class="card-img" style="background: url('https://i.postimg.cc/Y0P5s3m2/meng-xiang-fa-she-ji-hua-20260516152748-326-100.png') center/cover no-repeat;"></div>
            <div class="card-info">
                <div class="card-title">梦想发射计划</div>
                <div class="card-date">发布时间:2026-05-15</div>
            </div>
        </div>
        <div class="video-card" onclick="openModal('danceout_20260515_2.mp4')">
            <div class="card-img" style="background: url('https://i.postimg.cc/qMPRtcZr/danceout-20260530154102-327-100.png') center/cover no-repeat;"></div>
            <div class="card-info">
                <div class="card-title">Dance out </div>
                <div class="card-date">发布时间:2026-05-15</div>
            </div>
        </div>
    </div>
</div>

<!-- 视频弹窗 -->
<div class="modal-overlay" id="videoModal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <video class="modal-video" id="modalVideo" controls>
            <source src="" type="video/mp4">
        </video>
    </div>
</div>

<script>
// 视频弹窗控制
const modal = document.getElementById('videoModal');
const modalVideo = document.getElementById('modalVideo');

function openModal(videoUrl) {
    modalVideo.src = videoUrl;
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden'; // 禁止背景滚动
}

function closeModal() {
    modal.style.display = 'none';
    modalVideo.pause();
    modalVideo.src = '';
    document.body.style.overflow = 'auto';
}

// 点击遮罩层关闭
modal.addEventListener('click', function(e) {
    if (e.target === modal) {
        closeModal();
    }
});
</script>

</body>
</html>
