/* 导航栏 */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 40px;

}

.logo {
    font-weight: bold;
    font-size: 21px;
    color: #ffffff;
}

.nav-links {
    display: flex;
    gap: 40px;
}

.nav-links a {
    text-decoration: none;
    color: #ffffff;

}

.nav-links a:hover,
.nav-links a.active {

  :root{
    --bg: #F7F3FB;
    --card-bg: #FFFFFF;
    --accent: #FF3D81;
    --accent-2: #7C5CFC;
    --text-main: #2E2A38;
    --text-muted: #8B8696;
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Noto Sans SC', sans-serif;
    color:var(--text-main);
  }


  /* 瀑布流(上下滑动)布局:用多栏 column 实现真正的 Pinterest 式错落 */
  .wall{
    max-width:1280px;
    margin:40px auto 0;
    padding:0 24px 60px;
    column-count:4;
    column-gap:16px;
  }
  @media (max-width:1000px){ .wall{ column-count:3; } }
  @media (max-width:700px){ .wall{ column-count:2; } }
  @media (max-width:420px){ .wall{ column-count:2; column-gap:10px; } }

  .card{
    position:relative;
    background:var(--card-bg);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 2px 10px rgba(60,30,80,0.06);
    display:block;
    break-inside:avoid;
    margin-bottom:16px;
    cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 24px rgba(60,30,80,0.14);
  }

  .thumb{
    position:relative;
    background-size:cover;
    background-position:center;
  }
  .thumb::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.45), transparent 55%);
  }
  .play-btn{
    position:absolute;
    top:50%; left:50%;
    width:46px; height:46px;
    margin:-23px 0 0 -23px;
    border-radius:50%;
    background:rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center;
    transition:transform .2s ease, background .2s ease;
    z-index:2;
  }
  .card:hover .play-btn{
    background:var(--accent);
    transform:scale(1.1);
  }
  .play-btn svg{ width:16px; height:16px; fill:#fff; margin-left:2px; }

  .tag{
    position:absolute;
    top:10px; left:10px;
    z-index:2;
    font-size:11px;
    padding:3px 9px;
    border-radius:999px;
    background:rgba(255,255,255,.9);
    color:var(--accent-2);
    font-weight:500;
  }

  .meta{
    padding:12px 14px 14px;
  }
  .meta .v-title{
    font-size:14px;
    font-weight:500;
    margin:0 0 4px;
    line-height:1.3;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;

  }
  .meta .v-date{
    font-size:12px;
    color:var(--text-muted);
  }

  .locked .thumb{ filter:grayscale(.5) brightness(.7); }
  .locked .play-btn{ display:none; }
  .locked .lock-label{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    color:#fff; font-size:13px; font-weight:500;
    z-index:2;
    background:rgba(0,0,0,.35);
    padding:6px 14px; border-radius:999px;
  }

  .load-more{
    display:block;
    margin:10px auto 0;
    padding:10px 28px;
    border-radius:999px;
    border:1px solid var(--accent);
    color:var(--accent);
    background:#fff;
    font-size:14px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .load-more:hover{ background:var(--accent); color:#fff; }
  .load-wrap{ text-align:center; padding-bottom:40px; }

  /* 点击弹窗播放 */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(20,10,20,.82);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
    padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:#0e0a12;
    border-radius:18px;
    overflow:hidden;
    max-width:720px;
    width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    position:relative;
    animation:popIn .25s ease;
  }
  @keyframes popIn{ from{ transform:scale(.92); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .modal-box video{
    width:100%;
    max-height:80vh;
    display:block;
    background:#000;
  }
  .modal-close{
    position:absolute;
    top:10px; right:10px;
    width:34px; height:34px;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    color:#fff;
    border:none;
    font-size:18px;
    line-height:1;
    cursor:pointer;
    z-index:2;
    transition:background .2s ease;
  }
  .modal-close:hover{ background:var(--accent); }
  .modal-info{
    padding:14px 18px 18px;
    color:#fff;
  }
  .modal-info .m-title{
    font-family:'ZCOOL KuaiLe', sans-serif;
    font-size:18px;
    margin:0 0 4px;
  }
  .modal-info .m-date{
    font-size:12px;
    color:#c9b6cf;
  }
/* 页脚 */
.footer {

    padding: 20px;

    color: #fff;
    margin-top:60px ;
    font-size: 15px;

 .footer-links a {
    color: #fff;
    text-decoration: none;
    margin: 0 10px;
}

</style>

const wall = document.getElementById('wall');
const overlay = document.getElementById('modalOverlay');
const modalVideo = document.getElementById('modalVideo');
const modalTitle = document.getElementById('modalTitle');
const modalDate = document.getElementById('modalDate');

function render(filter='all'){
  wall.innerHTML = '';
  videos
    .filter(v => filter === 'all' || v.cat === filter)
    .forEach((v) => {
      const card = document.createElement('div');
      card.className = 'card' + (v.locked ? ' locked' : '');
      card.innerHTML = `
        <div class="thumb" style="height:${v.h}px;background:url(${v.thumbImg}) center/cover no-repeat;">
          ${v.locked
            ? '<div class="lock-label">🔒 待解锁</div>'
            : '<div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>'}
        </div>
        <div class="meta">
          <p class="v-title">${v.title}</p >
          <p class="v-date">发布时间:${v.date}</p >
        </div>`;
      if(!v.locked){
        card.addEventListener('click', () => openModal(v));
      }
      wall.appendChild(card);
    });
}

function openModal(v){
  modalVideo.src = v.src;
  modalTitle.textContent = v.title;
  modalDate.textContent = '发布时间:' + v.date;
  overlay.classList.add('show');
  modalVideo.play().catch(()=>{});
}

function closeModal(){
  overlay.classList.remove('show');
  modalVideo.pause();
  modalVideo.src = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => {
  if(e.target === overlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeModal();
});





render();
</script>
